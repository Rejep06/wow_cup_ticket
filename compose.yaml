name: wowcup-tickets
services:
  wowcup:
    build: .
    image: wowcup-checkout-v6-novnc:local
    container_name: wowcup-checkout
    restart: unless-stopped
    init: true
    shm_size: 1gb
    env_file:
      - .env
    environment:
      DISPLAY: ":99"
      XAUTHORITY: "/home/runner/.Xauthority"
    volumes:
      - ./data:/app/data
      - ./ui.json:/app/ui.json:ro
    # On the VPS, noVNC is accessible ONLY from the VPS localhost.
    # Use ssh -L 6080:127.0.0.1:6080 ... or Tailscale Serve.
    ports:
      - "127.0.0.1:6080:6080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
